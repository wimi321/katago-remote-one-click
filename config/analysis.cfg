# Conservative interactive defaults for a single remote Lizzie/KaTrain client.
# Individual requests may override maxVisits and maxTime.
logDir = analysis_logs
logErrorsAndWarnings = true
reportAnalysisWinratesAs = BLACK
analysisPVLen = 15
wideRootNoise = 0.04
maxVisits = 1000
numAnalysisThreads = 4
numSearchThreadsPerAnalysisThread = 8
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 22
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true
