name: Public WSS end-to-end

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify authenticated public round trip
        run: scripts/test-public-tunnel.sh
