name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify tag and source version
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v0.1.0"
          grep -F 'VERSION="v0.1.0"' install.sh
      - name: Test and build release
        shell: bash
        run: |
          scripts/check-repository.sh
          scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: KataGo Remote One-Click v0.1.0
          body_path: .github/release-notes/v0.1.0.md
          fail_on_unmatched_files: true
          files: |
            dist/katago-remote-linux-amd64
            dist/install.sh
            dist/SHA256SUMS
            dist/LICENSE
