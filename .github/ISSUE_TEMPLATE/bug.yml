name: Bug report
description: Report a reproducible installation, connection, or protocol problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Never paste the full WSS link, access token, password, or cloud credential.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Linux NVIDIA GPU server
        - Google Colab
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Describe the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Paste `katago-remote doctor` and relevant logs after removing private URLs and tokens.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed the complete WSS link, access token, passwords, and cloud credentials.
          required: true
